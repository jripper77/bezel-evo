<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bezel Evo</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/shell.css" />
    <link rel="stylesheet" href="styles/library.css" />
    <link rel="stylesheet" href="styles/inspector.css" />
    <link rel="stylesheet" href="styles/card.css" />
    <link rel="stylesheet" href="styles/screen.css" />
    <link rel="stylesheet" href="styles/connect.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="" width="28" height="28" />
      </div>
      <!-- The theme's name and, under it, whether it is saved (D-2026-10-20-studio-ux-v2-11). -->
      <div class="theme-title">
        <label class="theme-name">
          <span class="visually-hidden" data-i18n="top.themeName"></span>
          <input id="theme-name" type="text" spellcheck="false" data-i18n-aria-label="top.themeName" />
          <svg class="theme-name-edit" data-icon="pencil" width="12" height="12"></svg>
        </label>
        <p class="save-state" id="save-state" role="status" aria-live="polite">
          <span class="save-dot" aria-hidden="true"></span>
          <span id="status-main"></span>
          <span class="status-saved-at" id="status-saved-at"></span>
        </p>
      </div>
      <div class="spacer"></div>
      <div class="screen-chip" id="screen-chip">
        <span class="dot" id="screen-dot" aria-hidden="true"></span>
        <span class="screen-chip-name" id="screen-chip-name" aria-hidden="true"></span>
        <span class="screen-chip-meta" id="screen-chip-meta" aria-hidden="true"></span>
        <span class="screen-chip-profile" id="screen-chip-profile" hidden>
          <svg data-icon="profile" width="13" height="13"></svg>
          <span id="screen-chip-profile-name"></span>
          <small id="screen-chip-profile-mode"></small>
        </span>
        <svg data-icon="chevronDown" width="14" height="14"></svg>
        <select id="screen-select" data-i18n-aria-label="library.screen"></select>
      </div>
      <div class="spacer"></div>
      <label class="live-toggle" data-i18n-title="top.liveHint">
        <input type="checkbox" id="live" role="switch" />
        <svg data-icon="live" width="18" height="18"></svg>
        <span data-i18n="top.live"></span>
      </label>
      <button type="button" class="text-button save-button" id="save" data-i18n-title="shell.saveHint">
        <span data-i18n="common.save"></span>
        <kbd aria-hidden="true" data-i18n="shell.saveKeys"></kbd>
      </button>
      <button type="button" class="icon-button quiet" id="more-menu" aria-haspopup="menu" aria-expanded="false" data-i18n-title="shell.more" data-i18n-aria-label="shell.more">
        <svg data-icon="more" width="18" height="18"></svg>
      </button>
    </header>

    <main class="workspace">
      <nav class="sidebar" data-i18n-aria-label="library.title">
        <div class="tabs rail" role="tablist" aria-orientation="vertical" data-i18n-aria-label="library.title">
          <div class="tab-design" role="presentation">
            <button type="button" role="tab" id="tab-themes" aria-controls="panel-themes" aria-selected="false" tabindex="-1" data-tab="themes" data-i18n-aria-label="library.themes" data-i18n-title="library.themes">
              <svg data-icon="themes" width="10"></svg>
              <span class="rail-label" data-i18n="library.themes"></span>
            </button>
            <button type="button" role="tab" id="tab-widgets" aria-controls="panel-widgets" aria-selected="true" data-tab="widgets" data-i18n-aria-label="library.widgets" data-i18n-title="library.widgets">
              <svg data-icon="widgets" width="7"></svg>
              <span class="rail-label" data-i18n="library.widgets"></span>
            </button>
            <button type="button" role="tab" id="tab-sensors" aria-controls="panel-sensors" aria-selected="false" tabindex="-1" data-tab="sensors" data-i18n-aria-label="common.sensors" data-i18n-title="common.sensors">
              <svg data-icon="sensors"></svg>
              <span class="rail-label" data-i18n="common.sensors"></span>
            </button>
            <button type="button" role="tab" id="tab-layers" aria-controls="panel-layers" aria-selected="false" tabindex="-1" data-tab="layers" data-i18n-aria-label="library.layers" data-i18n-title="library.layers">
              <svg data-icon="layers"></svg>
              <span class="rail-label" data-i18n="library.layers"></span>
            </button>
            <button type="button" role="tab" id="tab-media" aria-controls="panel-media" aria-selected="false" tabindex="-1" data-tab="media" data-i18n-aria-label="library.media" data-i18n-title="library.media">
              <svg data-icon="media" width="18"></svg>
              <span class="rail-label" data-i18n="library.media"></span>
            </button>
          </div>
          <div class="tab-device" role="presentation">
            <button type="button" role="tab" id="tab-screen" aria-controls="panel-screen" aria-selected="false" tabindex="-1" data-tab="screen" data-i18n-aria-label="library.screen" data-i18n-title="library.screen">
              <svg data-icon="screen" width="10"></svg>
              <span class="rail-label" data-i18n="library.screen"></span>
            </button>
          </div>
        </div>
        <div class="library" id="library-panels">
        <section class="panel library-panel" role="tabpanel" id="panel-widgets" aria-labelledby="tab-widgets">
          <div class="panel-head"><h2 data-i18n="library.widgets"></h2><span class="count" id="widget-count"></span></div>
          <div class="panel-search" id="widget-search"></div>
          <div class="widget-groups" id="widget-groups"></div>
          <div class="panel-end" id="widget-hint"></div>
        </section>
        <section class="panel library-panel" role="tabpanel" id="panel-sensors" aria-labelledby="tab-sensors" hidden>
          <div class="panel-head"><h2 data-i18n="common.sensors"></h2><span class="panel-rate" id="sensor-rate"></span></div>
          <div class="panel-search" id="sensor-search-box"></div>
          <div class="chip-group" role="group" id="sensor-filter" data-i18n-aria-label="library.filterHardware"></div>
          <div class="sensor-probe-filters fld-grid" id="sensor-probe-filters"></div>
          <p class="sensor-result-count hint" id="sensor-result-count" aria-live="polite"></p>
          <div id="sensor-list" class="sensor-list"></div>
          <div id="sensor-libre"></div>
          <p class="hint panel-foot panel-end" data-i18n="sensorsPanel.hint"></p>
        </section>
        <section class="panel library-panel" role="tabpanel" id="panel-layers" aria-labelledby="tab-layers" hidden>
          <div class="panel-head">
            <h2 data-i18n="library.layers"></h2>
            <span class="panel-tools">
              <button type="button" class="icon-button" id="layers-expand" data-i18n-title="layers.expandAll" data-i18n-aria-label="layers.expandAll">
                <svg data-icon="expandAll"></svg>
              </button>
              <button type="button" class="icon-button" id="layers-collapse" data-i18n-title="layers.collapseAll" data-i18n-aria-label="layers.collapseAll">
                <svg data-icon="collapseAll"></svg>
              </button>
            </span>
          </div>
          <div class="panel-search" id="layer-search"></div>
          <div id="layer-type"></div>
          <div id="layer-front"></div>
          <ul class="layer-list" id="layer-list"></ul>
          <div class="layer-selection panel-end" id="layer-selection" role="group" data-i18n-aria-label="layersPanel.selection" hidden></div>
        </section>
        <section class="panel library-panel" role="tabpanel" id="panel-themes" aria-labelledby="tab-themes" hidden>
          <div class="panel-head">
            <h2 data-i18n="library.themes"></h2>
            <span class="count theme-totals"><span id="theme-count" role="status"></span><span id="theme-screen-count"></span></span>
          </div>
          <button type="button" class="text-button" id="theme-gallery" aria-haspopup="dialog" data-i18n="themesPanel.gallery"></button>
          <div class="theme-actions">
            <button type="button" class="text-button" id="theme-profiles" aria-haspopup="dialog" data-i18n="profiles.title"></button>
            <button type="button" class="text-button import-button" id="theme-import" data-i18n-title="themes.importHint">
              <svg data-icon="upload"></svg>
              <span data-i18n="themes.import"></span>
            </button>
            <button type="button" class="icon-button" id="theme-open" data-i18n-title="themes.open" data-i18n-aria-label="themes.open">
              <svg data-icon="refresh"></svg>
            </button>
            <button type="button" class="icon-button" id="theme-save-as" data-i18n-title="themes.saveAsHint" data-i18n-aria-label="themes.saveAs">
              <svg data-icon="download"></svg>
            </button>
          </div>
          <div id="import-report"></div>
          <div class="panel-search" id="theme-search"></div>
          <div class="theme-filter">
            <div class="segmented" role="group" id="theme-scope" data-i18n-aria-label="themes.scopeLabel">
              <button type="button" data-scope="screen" aria-pressed="false" data-i18n="themes.forScreen"></button>
              <button type="button" data-scope="all" aria-pressed="true" data-i18n="collection.filter.all"></button>
            </div>
            <div class="segmented" role="group" id="theme-axis" data-i18n-aria-label="themes.axisLabel">
              <button type="button" data-axis="all" aria-pressed="true" data-i18n-aria-label="themes.bothAxes" data-i18n-title="themes.bothAxes"><svg data-icon="grid" width="16" height="16"></svg></button>
              <button type="button" data-axis="vertical" aria-pressed="false" data-i18n-aria-label="axis.vertical" data-i18n-title="axis.vertical"><svg data-icon="vertical" width="16" height="16"></svg></button>
              <button type="button" data-axis="horizontal" aria-pressed="false" data-i18n-aria-label="axis.horizontal" data-i18n-title="axis.horizontal"><svg data-icon="horizontal" width="16" height="16"></svg></button>
            </div>
          </div>
          <ul class="theme-grid" id="theme-grid"></ul>
        </section>
        <section class="panel library-panel" role="tabpanel" id="panel-media" aria-labelledby="tab-media" hidden>
          <div class="panel-head"><h2 data-i18n="library.media"></h2></div>
          <div class="subtabs" role="tablist" data-i18n-aria-label="library.media">
            <button type="button" role="tab" id="subtab-media-theme" aria-controls="media-theme" aria-selected="true" data-subtab="theme" data-i18n="media.thisTheme"></button>
            <button type="button" role="tab" id="subtab-media-collection" aria-controls="media-collection" aria-selected="false" tabindex="-1" data-subtab="collection" data-i18n="media.collection"></button>
            <button type="button" role="tab" id="subtab-media-icons" aria-controls="media-icons" aria-selected="false" tabindex="-1" data-subtab="icons" data-i18n="media.icons"></button>
          </div>
          <div role="tabpanel" id="media-icons" aria-labelledby="subtab-media-icons" hidden></div>
          <div role="tabpanel" id="media-theme" aria-labelledby="subtab-media-theme">
            <div class="media-drop">
              <span class="kind-icon" aria-hidden="true"><svg data-icon="upload"></svg></span>
              <strong class="media-drop-title" data-i18n="mediaPanel.dropTitle"></strong>
              <p class="hint" data-i18n="mediaPanel.dropBody"></p>
              <p class="media-formats" data-i18n="media.formats"></p>
              <div class="button-row">
                <button type="button" class="text-button" id="media-add" data-i18n="media.add"></button>
                <button type="button" class="text-button" id="media-add-video" data-i18n="media.addVideo"></button>
              </div>
            </div>
            <p class="media-status" id="media-status" role="status" hidden>
              <span class="kind-icon" aria-hidden="true"><svg data-icon="video"></svg></span>
              <span data-i18n="media.adding"></span>
            </p>
            <div id="media-head"></div>
            <ul class="media-list" id="media-list"></ul>
          </div>
          <div role="tabpanel" id="media-collection" aria-labelledby="subtab-media-collection" hidden>
            <p class="hint" data-i18n="media.collectionHint"></p>
            <div id="collection-panel" class="collection"></div>
          </div>
          <button type="button" class="search-box gif-search-open panel-end" id="gif-search-open" aria-haspopup="dialog">
            <svg data-icon="search"></svg>
            <span class="gif-search-label" data-i18n="media.searchGifs"></span>
            <span class="count" data-i18n="mediaPanel.provider"></span>
          </button>
        </section>
        <section class="panel" role="tabpanel" id="panel-screen" aria-labelledby="tab-screen" hidden>
          <div class="panel-head"><h2 data-i18n="library.screen"></h2></div>
          <div class="subtabs" role="tablist" data-i18n-aria-label="library.screen">
            <button type="button" role="tab" id="subtab-device" aria-controls="screen-device" aria-selected="true" data-subtab="device" data-i18n="screen.settingsTab"></button>
            <button type="button" role="tab" id="subtab-storage" aria-controls="screen-storage" aria-selected="false" tabindex="-1" data-subtab="storage" data-i18n="screen.storageTab"></button>
          </div>
          <div role="tabpanel" id="screen-device" aria-labelledby="subtab-device">
            <div id="screen-panel"></div>
            <section id="standby-panel" class="standby" aria-labelledby="standby-title" hidden></section>
          </div>
          <div role="tabpanel" id="screen-storage" aria-labelledby="subtab-storage" hidden>
            <div id="storage-panel" class="storage"></div>
          </div>
        </section>
        </div>
      </nav>
      <div class="panel-resizer" id="resize-library" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="library-panels" data-panel="library" data-i18n-aria-label="shell.resizeLibrary"></div>

      <section class="stage" id="stage" data-i18n-aria-label="stage.title">
        <div class="framing-hud" id="framing-hud" hidden>
          <svg data-icon="frame"></svg>
          <div class="framing-hud-text">
            <strong data-i18n="framing.hudTitle"></strong>
            <span class="framing-numbers" id="framing-numbers"></span>
            <span class="framing-keys" id="framing-keys" data-i18n="framing.hudKeys"></span>
          </div>
          <button type="button" class="primary-button" id="framing-done" data-i18n="common.done"></button>
        </div>
        <div class="stage-tools" role="group" data-i18n-aria-label="stage.tools">
          <div class="orientation-tools" role="group" data-i18n-aria-label="top.orientation">
            <div class="segmented">
              <button type="button" id="orient-vertical" aria-pressed="false" data-i18n-aria-label="axis.vertical" data-i18n-title="top.verticalHint">
                <svg data-icon="vertical" width="16" height="16"></svg>
              </button>
              <button type="button" id="orient-horizontal" aria-pressed="false" data-i18n-aria-label="axis.horizontal" data-i18n-title="top.horizontalHint">
                <svg data-icon="horizontal" width="16" height="16"></svg>
              </button>
            </div>
            <button type="button" class="icon-button quiet" id="orient-turn" aria-pressed="false" data-i18n-title="top.turnHint" data-i18n-aria-label="top.turn">
              <svg data-icon="refresh" width="18" height="18"></svg>
            </button>
          </div>
          <span class="tool-sep" aria-hidden="true"></span>
          <div class="toolbar" role="toolbar" data-i18n-aria-label="top.edit">
            <button type="button" class="icon-button quiet" id="undo" data-i18n-title="top.undo" data-i18n-aria-label="top.undo">
              <svg data-icon="undo" width="18" height="18"></svg>
            </button>
            <button type="button" class="icon-button quiet" id="redo" data-i18n-title="top.redo" data-i18n-aria-label="top.redo">
              <svg data-icon="redo" width="18" height="18"></svg>
            </button>
          </div>
          <span class="tool-sep" aria-hidden="true"></span>
          <button type="button" class="icon-button quiet" id="grid-toggle" aria-pressed="false" data-i18n-title="shell.grid" data-i18n-aria-label="shell.grid">
            <svg data-icon="grid" width="18" height="18"></svg>
          </button>
          <button type="button" class="icon-button quiet" id="trial-values" aria-pressed="false" data-i18n-title="shell.trialValues" data-i18n-aria-label="shell.trialValues">
            <svg data-icon="test-values" width="18" height="18"></svg>
          </button>
        </div>
        <p class="visually-hidden" id="framing-live" aria-live="polite"></p>
        <section class="connect" id="connect" aria-labelledby="connect-title" hidden></section>
        <div class="stage-scroll" id="stage-scroll">
          <div class="stage-frame">
            <div class="bezel" id="bezel">
              <div class="canvas-box" id="canvas-box">
                <canvas id="preview" width="480" height="1920" data-i18n-aria-label="stage.preview" role="img"></canvas>
                <div class="overlay" id="overlay"></div>
              </div>
            </div>
            <p class="stage-legend" id="stage-legend"></p>
          </div>
        </div>
        <div class="toolbar zoom stage-zoom" role="toolbar" data-i18n-aria-label="framing.zoom">
          <button type="button" class="icon-button quiet" id="zoom-out" data-i18n-title="top.zoomOut" data-i18n-aria-label="top.zoomOut">
            <svg data-icon="minus" width="16" height="16"></svg>
          </button>
          <output class="zoom-label" id="zoom-label">100%</output>
          <button type="button" class="icon-button quiet" id="zoom-in" data-i18n-title="top.zoomIn" data-i18n-aria-label="top.zoomIn">
            <svg data-icon="plus" width="16" height="16"></svg>
          </button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button type="button" class="text-button quiet" id="zoom-fit" data-i18n="shell.fit" data-i18n-title="top.zoomFit"></button>
        </div>
      </section>

      <div class="panel-resizer" id="resize-inspector" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="inspector" data-panel="inspector" data-i18n-aria-label="shell.resizeInspector"></div>
      <aside class="inspector" id="inspector" data-i18n-aria-label="inspector.title"></aside>
    </main>

    <footer class="statusbar" role="status" aria-live="polite">
      <span class="status-selection" id="status-selection"></span>
      <span class="spacer"></span>
      <span id="status-libre" hidden>
        <button type="button" id="status-libre-toggle" class="status-chip" aria-haspopup="dialog" aria-expanded="false" aria-controls="libre-popover">
          <span id="status-libre-dot" class="status-dot" aria-hidden="true"></span>
          <span id="status-libre-label"></span>
        </button>
      </span>
      <span id="status-memory"></span>
      <span id="status-screen"></span>
    </footer>
    <div class="libre-popover" id="libre-popover" role="dialog" aria-labelledby="libre-popover-title" hidden>
      <div class="libre-popover-head">
        <span id="libre-popover-dot" class="status-dot" aria-hidden="true"></span>
        <h2 id="libre-popover-title"></h2>
        <button type="button" class="icon-button libre-popover-close" data-i18n-title="dialog.close" data-i18n-aria-label="dialog.close">
          <svg data-icon="close"></svg>
        </button>
      </div>
      <p class="libre-popover-note" id="libre-popover-note" hidden></p>
      <ul class="libre-hardware" id="libre-hardware" data-i18n-aria-label="sensorChip.probes"></ul>
      <div class="libre-popover-actions">
        <button type="button" class="text-button" id="libre-open-sensors" data-i18n="sensorStatus.openSensors"></button>
      </div>
    </div>
    <div class="toast" id="toast" role="alert" hidden></div>
  </body>
</html>
