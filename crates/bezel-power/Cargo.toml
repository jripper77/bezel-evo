[package]
name = "bezel-power"
description = "Adapter of Bezel for the machine's power events: the end of the session on Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
tracing.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The handoff store implements a port of the core (`HandoffStore`).
bezel-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }


[target.'cfg(windows)'.dependencies]
# GetSystemMetrics(SM_SHUTTINGDOWN): whether the session is ending.
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory", "Win32_Foundation", "Win32_System_Registry"] }

[lints]
workspace = true

[dev-dependencies]
bezel-devices = { workspace = true }
tempfile = "3.27.0"
