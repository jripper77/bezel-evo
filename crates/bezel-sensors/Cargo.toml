[package]
name = "bezel-sensors"
description = "Driven adapter of Bezel that measures the machine: CPU, GPU, memory, disks, network and hwmon sensors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bezel-core = { workspace = true }
tracing = { workspace = true }
# NVML is loaded at run time (libnvidia-ml.so.1 / nvml.dll): without the
# NVIDIA driver there are simply no NVIDIA sensors (D-2026-09-30-sensors-2).
nvml-wrapper = "0.13.0"
# net.ping: unprivileged ICMP datagram sockets (Linux `ping_group_range`),
# safe API; std has no ICMP socket (D-2026-09-30-release-polish-5).
socket2 = "0.6.5"
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }


[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
# LibreHardwareMonitor: legacy WMI or the local web server in recent releases.
wmi = "0.18.4"
windows = { version = "0.62.2", features = ["Win32_System_WinRT", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp"] }
windows-future = "0.3.2"
windows-core = "0.62.2"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
# gpu.fps: RivaTuner Statistics Server's named shared memory, opened and
# copied read-only (D-2026-09-30-release-polish-4).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Security", "Wdk_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_StationsAndDesktops", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_System_Services"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
