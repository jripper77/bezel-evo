[package]
name = "bezel-themes"
description = "Theme files of Bezel: the native .bezeltheme format and importers for other apps' themes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bezel-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
tracing = { workspace = true }
# The names inside a vendor font file, to bundle the fonts a .turtheme names.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
